name: deploy.
on:
  pull_request:
    types: [edited, opened]

env:
  BRANCH: ${{ github.event.pull_request.base.ref }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

  tests_coverage:
    needs: lint
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
  
  build:
    needs: tests_coverage
    name: Build Coprocessor Applications
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      SUBGRAPH_NAMES: ${{ steps.extract_subgraphs.outputs.SUBGRAPH_NAMES_BASE64 }}
    steps:
      - name: Extract Subgraph Names from PR
        id: extract_subgraphs
        run: |
          PR_BODY=$(jq -r '.pull_request.body' < "$GITHUB_EVENT_PATH")
          echo "PR_BODY Content: $PR_BODY"

          SUBGRAPH_NAMES=""
          while IFS= read -r line; do
            SUBGRAPH=$(echo "$line" | awk -F'`' '{print $2}' | tr -d '\r')
            if [[ -n "$SUBGRAPH" ]]; then
              SUBGRAPH_NAMES+="$SUBGRAPH "
            fi
          done < <(echo "$PR_BODY" | grep -i "Subgraph Name:")

          SUBGRAPH_NAMES=$(echo "$SUBGRAPH_NAMES" | xargs) # Remove extra spaces
          SUBGRAPH_NAMES_BASE64=$(echo -n "$SUBGRAPH_NAMES" | base64)

          echo "Extracted Subgraph Names: $SUBGRAPH_NAMES"
          echo "SUBGRAPH_NAMES=$SUBGRAPH_NAMES" >> $GITHUB_ENV
          echo "SUBGRAPH_NAMES_BASE64=$SUBGRAPH_NAMES_BASE64" >> $GITHUB_ENV

          echo "SUBGRAPH_NAMES=$SUBGRAPH_NAMES" >> "$GITHUB_OUTPUT"
          echo "SUBGRAPH_NAMES_BASE64=$SUBGRAPH_NAMES_BASE64" >> "$GITHUB_OUTPUT"

          echo "SUBGRAPH_NAMES_JSON=$SUBGRAPH_JSON" >> "$GITHUB_OUTPUT"


      - name: Build and Push Docker Images
        run: |
          IFS=' ' read -r -a SUBGRAPH_ARRAY <<< "${{ env.SUBGRAPH_NAMES }}"
          for SUBGRAPH in "${SUBGRAPH_ARRAY[@]}"; do
            echo "Building Docker Image for Subgraph: $SUBGRAPH"
            # docker build -t gcr.io/my-project/$SUBGRAPH:latest .
            # docker push gcr.io/my-project/$SUBGRAPH:latest
          done
  deploy:
    name: Deploy Coprocessor Applications
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    env:
      SUBGRAPH_NAMES_BASE64: ${{ needs.build.outputs.SUBGRAPH_NAMES }}
    steps:
      - name: Decode Received Subgraph Names
        run: |
          SUBGRAPH_NAMES=$(echo "$SUBGRAPH_NAMES_BASE64" | base64 --decode)
          echo "Decoded SUBGRAPH_NAMES: $SUBGRAPH_NAMES"
          echo "SUBGRAPH_NAMES=$SUBGRAPH_NAMES" >> $GITHUB_ENV

      - name: Deploy Using Helm
        run: |
          IFS=' ' read -r -a SUBGRAPH_ARRAY <<< "$SUBGRAPH_NAMES"
          for SUBGRAPH in "${SUBGRAPH_ARRAY[@]}"; do
            echo "Deploying Subgraph: $SUBGRAPH"
            echo "Dev:AP=$DEV_AP"
            # helm upgrade --install $SUBGRAPH ./helm/$SUBGRAPH \
            #   --namespace=dev \
            #   --set image.tag=latest \
            #   --wait --atomic \
            #   --timeout 10m \
            #   --debug
          done
  
